}
function ub(i){const it=S.bag[i];if(it.id==='fix'){S.chp=S.fuel=100;toast('🔧 Отремонтировано!');}else{if(it.en)S.en=Math.min(100,S.en+it.en);if(it.hp)S.hp=Math.min(100,S.hp+it.hp);}if(--it.cnt<=0)S.bag.splice(i,1);save();upd();openM('bag');}
async function lg(){const u=document.getElementById('ul').value.trim();if(!u)return;S.user=u;save();upd();try{const r=await fetch('https://keyvalue.immanuel.co/api/KeyVal/GetValue/ns3d_'+encodeURIComponent(u)),tx=await r.text();if(tx&&tx.length>10){const cl=JSON.parse(JSON.parse(tx));if(cl.pts>S.pts){S={...S,...cl};rbPl();rbCar();rbHeli();rbPet();}}await fetch('https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/ns3d_'+encodeURIComponent(u)+'/'+encodeURIComponent(JSON.stringify(S)),{method:'POST'});toast('☁️ Синхронизировано!');}catch(e){toast('💾 Сохранено локально');}document.getElementById('md').style.display='none';}

buildCity();rbPl();rbPet();rbCar();rbHeli();pl.position.set(S.px,0,S.pz);car.position.set(S.cx,0,S.cz);car.rotation.y=S.cr;heli.position.set(S.hx,S.hy,S.hz);pet.position.copy(pl.position);upd();
if(isJailed())enterIn('prs');
setInterval(()=>{if(loc==='city'){S.px=pl.position.x;S.pz=pl.position.z;}S.cx=car.position.x;S.cz=car.position.z;S.cr=car.rotation.y;save();},10000);
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rn.setSize(innerWidth,innerHeight);};
let lt=performance.now();(function lp(nw){requestAnimationFrame(lp);const dt=Math.min(.05,(nw-lt)/1000);lt=nw;updP(dt);drawMM();rn.render(sc,cam);})(lt);
</script>
